name: Node.js Package

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: "Publish to NPM"
        required: true
        default: false
        type: boolean
      version_bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_to_npm == true
    permissions:
      contents: write
      packages: write
    steps:
      # Checkout with PAT to allow pushing the version bump commit back to the repo
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - run: npm ci
      - run: npm run build # Re-build in this job if your publish step depends on built outputs

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version_bump }} --no-git-tag-version
          git add package.json
          git commit -m "Bump version to $(node -p "require('./package.json').version")"
          git push

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
